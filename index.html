<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------------------------------- css ---------------------------------- */
const CSS = `
:root{
  --ink:#14202A; --paper:#fff; --canvas:#E9EEF1; --line:#D3DCE2;
  --muted:#5C6E79; --go:#1F6F5C; --go-soft:#E3F0EB;
  --wait:#A96C14; --wait-soft:#FAEEDC; --stop:#9E3838; --stop-soft:#F7E5E5;
  --spend:#3D6E8F;
}

}
.wrap{max-width:560px; margin:0 auto; padding:0 14px}

}

  flex:1; border:0; background:transparent; padding:8px 4px; border-radius:8px;

}

.card{background:var(--paper); border-radius:13px; padding:14px; margin-bottom:10px;
  box-shadow:0 1px 2px rgba(20,32,42,.07)}
.card.flat{box-shadow:none; border:1px solid var(--line)}

/* paycheck spine */
.check{display:flex; gap:11px; margin-bottom:10px}
.rail{width:46px; flex:none; display:flex; flex-direction:column; align-items:center; padding-top:14px}
.rail .mo{font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.rail .dy{font-size:21px; font-weight:800; letter-spacing:-.04em; line-height:1}
.rail .thread{flex:1; width:2px; background:var(--line); margin-top:8px; border-radius:2px; min-height:14px}

.line{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid #EEF2F4; font-size:13.5px}

.sect > .eyebrow{margin-bottom:2px}

.more{margin-top:10px; border:0; background:#F1F5F7; color:var(--muted); font-family:inherit;
  font-size:12.5px; font-weight:600; padding:7px; width:100%; border-radius:8px; cursor:pointer}

label.f{display:block; margin-bottom:11px}

  font-weight:600; padding:4px 0; cursor:pointer; text-decoration:underline}

  border-top:1px solid #EEF2F4; cursor:pointer}

.item .nm{font-weight:600; font-size:14.5px}
.item .mt{font-size:12px; color:var(--muted); margin-top:1px}
.item .vl{font-weight:700; white-space:nowrap}

.empty{text-align:center; padding:26px 14px; color:var(--muted); font-size:13.5px}
.empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px}
.warn{background:var(--wait-soft); color:var(--wait); font-size:12.5px; font-weight:600;
  padding:8px 10px; border-radius:8px; margin-bottom:10px}

.tiny{font-size:11.5px; color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ .card{transition:box-shadow .15s} }
`;

/* --------------------------------- helpers -------------------------------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const pd = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const fd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const addMonths = (d, n) => { const t = new Date(d.getFullYear(), d.getMonth() + n, 1); t.setDate(Math.min(d.getDate(), dim(t.getFullYear(), t.getMonth()))); return t; };
const MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const m0 = (n) => (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(n)).toLocaleString();
const m2 = (n) => (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const short = (d) => `${MO[d.getMonth()]} ${d.getDate()}`;
const num = (v) => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };

const FREQ = [
  ["monthly", "Every month"], ["biweekly", "Every 2 weeks"], ["weekly", "Every week"],
  ["quarterly", "Every 3 months"], ["semiannual", "Every 6 months"], ["annual", "Once a year"],
  ["once", "One time only"],
];
const step = (d, f) => {
  if (f === "weekly") return addDays(d, 7);
  if (f === "biweekly") return addDays(d, 14);
  if (f === "monthly") return addMonths(d, 1);
  if (f === "quarterly") return addMonths(d, 3);
  if (f === "semiannual") return addMonths(d, 6);
  if (f === "annual") return addMonths(d, 12);
  return null;
};

const todayISO = () => fd(new Date());
const DEFAULT = {
  pay: { firstDate: todayISO(), amount: 0, overrides: {} },
  monthsAhead: 6,
  spendPerCheck: 0,
  bills: [],
  goals: [],
  disp: {},
};

/* ------------------------------ the planner ------------------------------- */
function waterFill(amount, idxs, loads) {
  const out = {};
  if (amount <= 0 || !idxs.length) return out;
  const s = idxs.slice().sort((a, b) => loads[a] - loads[b]);
  for (let k = 1; k <= s.length; k++) {
    const last = k === s.length;
    const level = last ? Infinity : loads[s[k]];
    let cost = 0;
    for (let j = 0; j < k; j++) cost += level - loads[s[j]];
    if (last || cost >= amount) {
      let sum = 0;
      for (let j = 0; j < k; j++) sum += loads[s[j]];
      const lam = (amount + sum) / k;
      for (let j = 0; j < k; j++) out[s[j]] = lam - loads[s[j]];
      return out;
    }
  }
  return out;
}

function plan(st) {
  const start = pd(st.pay.firstDate);
  const end = addMonths(start, Math.max(1, st.monthsAhead));
  const checks = [];
  let d = new Date(start);
  while (d <= end && checks.length < 60) {
    const key = fd(d);
    const ov = st.pay.overrides[key];
    checks.push({ key, date: new Date(d), pay: ov === undefined || ov === "" ? num(st.pay.amount) : num(ov) });
    d = addDays(d, 14);
  }
  if (!checks.length) return { checks: [], occs: [], goalRows: [], flags: [] };

  // recurring goal contributions, converted to a per-check figure
  const goalRows = st.goals.map((g) => {
    let monthly = 0;
    if (g.mode === "fixed") monthly = num(g.monthly);
    else {
      const months = Math.max(1, num(g.months));
      monthly = num(g.target) / months;
    }
    return { ...g, monthly, perCheck: (monthly * 12) / 26 };
  });
  const goalPerCheck = goalRows.reduce((a, g) => a + g.perCheck, 0);
  const spend = num(st.spendPerCheck);
  const base = checks.map(() => spend + goalPerCheck);

  // every bill occurrence inside the window
  const occs = [];
  const flags = [];
  st.bills.forEach((b) => {
    if (!b.firstDue) return;
    let cur = pd(b.firstDue);
    let guard = 0;
    while (cur <= end && guard++ < 400) {
      if (cur >= start || b.freq === "once") {
        let payIdx = -1;
        for (let i = 0; i < checks.length; i++) if (checks[i].date <= cur) payIdx = i;
        if (payIdx === -1) { payIdx = 0; flags.push(`${b.name} is due ${short(cur)}, before your first paycheck lands.`); }
        occs.push({ id: uid(), billId: b.id, name: b.name, amount: num(b.amount), variable: !!b.variable, due: new Date(cur), payIdx });
      }
      const nx = step(cur, b.freq);
      if (!nx) break;
      cur = nx;
    }
  });
  occs.sort((a, b) => a.payIdx - b.payIdx || a.due - b.due);

  // spread each bill backward across the checks that precede it, keeping every check level
  const loads = base.slice();
  const allocs = occs.map(() => ({}));
  for (let round = 0; round < 12; round++) {
    occs.forEach((o, oi) => {
      const prev = allocs[oi];
      for (const k in prev) loads[k] -= prev[k];
      const idxs = [];
      for (let i = 0; i <= o.payIdx; i++) idxs.push(i);
      const a = waterFill(o.amount, idxs, loads);
      for (const k in a) loads[k] += a[k];
      allocs[oi] = a;
    });
  }

  // assemble each paycheck
  let carry = 0, reserve = 0;
  const rows = checks.map((c, i) => {
    const saving = [], paying = [];
    let billTotal = 0, paidTotal = 0;
    occs.forEach((o, oi) => {
      const a = allocs[oi][i] || 0;
      if (a > 0.004) { billTotal += a; (o.payIdx === i ? paying : saving).push({ ...o, set: a }); }
      else if (o.payIdx === i) paying.push({ ...o, set: 0 });
      if (o.payIdx === i) paidTotal += o.amount;
    });
    const committed = billTotal + goalPerCheck + spend;
    const available = c.pay + carry;
    const left = available - committed;
    reserve += billTotal - paidTotal;
    const disp = st.disp[c.key] || { type: "roll" };
    carry = disp.type === "roll" ? Math.max(0, left) : 0;
    const ratio = available > 0 ? left / available : 0;
    return {
      ...c, i, saving: saving.sort((a, b) => a.due - b.due), paying: paying.sort((a, b) => a.due - b.due),
      billTotal, paidTotal, goalPerCheck, spend, committed, available, carryIn: available - c.pay,
      left, reserve, disp, health: left < 0 ? "stop" : ratio < 0.08 ? "wait" : "go",
    };
  });
  return { checks: rows, occs, goalRows, flags };
}

/* saves via Claude's artifact storage when published there, browser storage when self-hosted */
const store = {
  async get(k) {
    if (typeof window.storage !== "undefined") {
      const r = await window.storage.get(k);
      return r ? r.value : null;
    }
    return window.localStorage.getItem(k);
  },
  async set(k, v) {
    if (typeof window.storage !== "undefined") return window.storage.set(k, v);
    return window.localStorage.setItem(k, v);
  },
};

/* ---------------------------------- app ----------------------------------- */
function App() {
  const [st, setSt] = useState(DEFAULT);
  const [tab, setTab] = useState("plan");
  const [ready, setReady] = useState(false);
  const first = useRef(true);

  useEffect(() => {
    (async () => {
      try {
        const raw = await store.get("paycheckplan:v1");
        if (raw) setSt({ ...DEFAULT, ...JSON.parse(raw) });
      } catch (e) { /* nothing saved yet */ }
      setReady(true);
    })();
  }, []);

  useEffect(() => {
    if (!ready) return;
    if (first.current) { first.current = false; return; }
    const t = setTimeout(() => {
      store.set("paycheckplan:v1", JSON.stringify(st)).catch(() => {});
    }, 350);
    return () => clearTimeout(t);
  }, [st, ready]);

  const up = (patch) => setSt((s) => ({ ...s, ...patch }));
  const model = useMemo(() => plan(st), [st]);
  const started = num(st.pay.amount) > 0 || st.bills.length > 0;

  return (
    <div className="app">
      <style>{CSS}</style>
      <div className="wrap">
        <header className="top">
          <h1>Paycheck Plan</h1>
          <p>{started
            ? `${model.checks.length} paychecks mapped through ${short(addMonths(pd(st.pay.firstDate), st.monthsAhead))}`
            : "Set your pay, then add what has to come out of it."}</p>
        </header>

        <nav className="tabs">
          {[["plan", "Plan"], ["pay", "Pay"], ["bills", "Bills"], ["goals", "Goals"]].map(([k, l]) => (
            <button key={k} data-on={tab === k ? "1" : "0"} onClick={() => setTab(k)}>{l}</button>
          ))}
        </nav>

        {tab === "plan" && <PlanView m={model} st={st} up={up} go={setTab} />}
        {tab === "pay" && <PayView st={st} up={up} m={model} setSt={setSt} />}
        {tab === "bills" && <BillsView st={st} up={up} />}
        {tab === "goals" && <GoalsView st={st} up={up} m={model} />}
      </div>
    </div>
  );
}

/* --------------------------------- plan tab -------------------------------- */
function PlanView({ m, st, up, go }) {
  const [open, setOpen] = useState({});
  if (!m.checks.length || (num(st.pay.amount) === 0 && !Object.keys(st.pay.overrides).length)) {
    return (
      <div className="card">
        <div className="empty">
          <b>Start with a paycheck</b>
          Enter your take-home pay and your next payday, and the plan builds itself.
        </div>
        <button className="act" onClick={() => go("pay")}>Set up pay</button>
      </div>
    );
  }
  const tight = m.checks.filter((c) => c.health !== "go").length;
  return (
    <>
      {m.flags.slice(0, 3).map((f, i) => <div className="warn" key={i}>{f}</div>)}
      <div className="card">
        <div className="eyebrow">How the run looks</div>
        <div style={{ fontSize: 15, marginTop: 4 }}>
          {tight === 0
            ? "Every paycheck clears its share with room left over."
            : `${tight} of ${m.checks.length} paychecks ${tight === 1 ? "runs" : "run"} tight. Trim spending money, stretch a goal, or move a due date.`}
        </div>
      </div>

      {m.checks.map((c) => {
        const isOpen = !!open[c.key];
        const pct = (v) => `${Math.max(0, Math.min(100, (v / Math.max(c.available, 1)) * 100))}%`;
        return (
          <div className="check" key={c.key}>
            <div className="rail">
              <div className="mo">{MO[c.date.getMonth()]}</div>
              <div className="dy num">{c.date.getDate()}</div>
              <div className="thread" />
            </div>
            <div className="body">
              <div className="card">
                <div className="chead">
                  <div>
                    <div className="amt num">{m0(c.pay)}</div>
                    {c.carryIn > 0.5 && <div className="tiny num">+ {m0(c.carryIn)} carried over</div>}
                  </div>
                  <span className={`pill ${c.health}`}>
                    {c.health === "stop" ? `${m0(-c.left)} short` : `${m0(c.left)} free`}
                  </span>
                </div>

                <div className="bar">
                  <span style={{ width: pct(c.billTotal), background: "var(--go)" }} />
                  <span style={{ width: pct(c.goalPerCheck), background: "#7BA8B8" }} />
                  <span style={{ width: pct(c.spend), background: "var(--spend)" }} />
                </div>
                <div className="legend">
                  <span><i style={{ background: "var(--go)" }} />Bills {m0(c.billTotal)}</span>
                  <span><i style={{ background: "#7BA8B8" }} />Goals {m0(c.goalPerCheck)}</span>
                  <span><i style={{ background: "var(--spend)" }} />Spending {m0(c.spend)}</span>
                </div>

                {c.paying.length > 0 && (
                  <div className="sect">
                    <div className="eyebrow">Pay now</div>
                    {c.paying.map((o) => (
                      <div className="line" key={o.id}>
                        <div className="l">{o.name}{o.variable ? " ~" : ""}
                          <span className="sub">due {short(o.due)}{o.set > 0.004 ? ` · ${m0(o.amount - o.set)} already held` : " · fully held"}</span>
                        </div>
                        <div className="r num">{m2(o.amount)}</div>
                      </div>
                    ))}
                  </div>
                )}

                {isOpen && (
                  <>
                    {c.saving.length > 0 && (
                      <div className="sect">
                        <div className="eyebrow">Set aside</div>
                        {c.saving.map((o) => (
                          <div className="line" key={o.id}>
                            <div className="l">{o.name}
                              <span className="sub">toward {m0(o.amount)} due {short(o.due)}</span>
                            </div>
                            <div className="r num">{m2(o.set)}</div>
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="sect">
                      <div className="eyebrow">Everything else</div>
                      <div className="line"><div className="l">Spending money</div><div className="r num">{m2(c.spend)}</div></div>
                      <div className="line"><div className="l">Savings &amp; debt goals</div><div className="r num">{m2(c.goalPerCheck)}</div></div>
                      <div className="line">
                        <div className="l"><b>Left over</b><span className="sub">held for later bills: {m0(Math.max(0, c.reserve))}</span></div>
                        <div className="r num" style={{ color: c.left < 0 ? "var(--stop)" : "var(--go)" }}>{m2(c.left)}</div>
                      </div>
                    </div>
                    <div className="sect">
                      <div className="eyebrow">Do what with the leftover</div>
                      <select
                        value={c.disp.type === "goal" ? `goal:${c.disp.goalId}` : c.disp.type}
                        onChange={(e) => {
                          const v = e.target.value;
                          const d = v.startsWith("goal:") ? { type: "goal", goalId: v.slice(5) } : { type: v };
                          up({ disp: { ...st.disp, [c.key]: d } });
                        }}>
                        <option value="roll">Roll it into the next paycheck</option>
                        <option value="free">Leave it as free cash</option>
                        {st.goals.map((g) => <option key={g.id} value={`goal:${g.id}`}>Send it to {g.name}</option>)}
                      </select>
                    </div>
                  </>
                )}
                <button className="more" onClick={() => setOpen({ ...open, [c.key]: !isOpen })}>
                  {isOpen ? "Hide detail" : `Show detail${c.saving.length ? ` · ${c.saving.length} set aside` : ""}`}
                </button>
              </div>
            </div>
          </div>
        );
      })}
    </>
  );
}

/* ---------------------------------- pay tab -------------------------------- */
function PayView({ st, up, m, setSt }) {
  const [backup, setBackup] = useState(false);
  const [paste, setPaste] = useState("");
  return (
    <>
      <div className="card">
        <div className="eyebrow">Income</div>
        <div className="note">Paid every two weeks, starting from the date below.</div>
        <label className="f"><span>Next payday</span>
          <input type="date" value={st.pay.firstDate}
            onChange={(e) => up({ pay: { ...st.pay, firstDate: e.target.value } })} /></label>
        <label className="f"><span>Take-home pay per check</span>
          <input inputMode="decimal" placeholder="0.00" value={st.pay.amount || ""}
            onChange={(e) => up({ pay: { ...st.pay, amount: e.target.value } })} /></label>
        <div className="row">
          <label className="f"><span>Spending money per check</span>
            <input inputMode="decimal" placeholder="0.00" value={st.spendPerCheck || ""}
              onChange={(e) => up({ spendPerCheck: e.target.value })} /></label>
          <label className="f"><span>Plan ahead</span>
            <select value={st.monthsAhead} onChange={(e) => up({ monthsAhead: parseInt(e.target.value) })}>
              {[3, 6, 9, 12, 18].map((n) => <option key={n} value={n}>{n} months</option>)}
            </select></label>
        </div>
      </div>

      {m.checks.length > 0 && (
        <div className="card">
          <div className="eyebrow">Adjust a single check</div>
          <div className="note">Overtime, a short check, a bonus — change just that one.</div>
          {m.checks.map((c) => (
            <div className="line" key={c.key}>
              <div className="l" style={{ paddingTop: 9 }}>{short(c.date)}</div>
              <div style={{ width: 120 }}>
                <input inputMode="decimal" className="num" placeholder={String(num(st.pay.amount) || 0)}
                  value={st.pay.overrides[c.key] ?? ""}
                  onChange={(e) => {
                    const o = { ...st.pay.overrides };
                    if (e.target.value === "") delete o[c.key]; else o[c.key] = e.target.value;
                    up({ pay: { ...st.pay, overrides: o } });
                  }} />
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="card">
        <button className="link" onClick={() => setBackup(!backup)}>Backup and restore</button>
        {backup && (
          <div style={{ marginTop: 10 }}>
            <div className="note">Copy this text somewhere safe. Paste it back in to restore everything.</div>
            <textarea rows={4} readOnly value={JSON.stringify(st)} onFocus={(e) => e.target.select()} />
            <div style={{ height: 9 }} />
            <textarea rows={2} placeholder="Paste a backup here" value={paste} onChange={(e) => setPaste(e.target.value)} />
            <div style={{ height: 9 }} />
            <button className="act ghost" onClick={() => {
              try { setSt({ ...DEFAULT, ...JSON.parse(paste) }); setPaste(""); }
              catch (e) { alert("That text isn't a valid backup."); }
            }}>Restore from paste</button>
            <div style={{ height: 9 }} />
            <button className="act danger" onClick={() => { if (confirm("Erase everything and start over?")) setSt(DEFAULT); }}>
              Erase everything
            </button>
          </div>
        )}
      </div>
    </>
  );
}

/* --------------------------------- bills tab ------------------------------- */
function BillsView({ st, up }) {
  const [edit, setEdit] = useState(null);
  const blank = () => ({ id: uid(), name: "", amount: "", firstDue: todayISO(), freq: "monthly", variable: false });
  const save = (b) => {
    const has = st.bills.some((x) => x.id === b.id);
    up({ bills: has ? st.bills.map((x) => (x.id === b.id ? b : x)) : [...st.bills, b] });
    setEdit(null);
  };
  const monthly = st.bills.reduce((a, b) => {
    const per = { weekly: 4.333, biweekly: 2.167, monthly: 1, quarterly: 1 / 3, semiannual: 1 / 6, annual: 1 / 12, once: 0 }[b.freq] || 0;
    return a + num(b.amount) * per;
  }, 0);

  return (
    <>
      {edit ? <BillForm b={edit} onSave={save} onCancel={() => setEdit(null)}
        onDelete={() => { up({ bills: st.bills.filter((x) => x.id !== edit.id) }); setEdit(null); }} /> : (
        <>
          <div className="card">
            {st.bills.length === 0 ? (
              <div className="empty"><b>No bills yet</b>Add rent, insurance, subscriptions — anything with a due date.</div>
            ) : (
              <>
                <div className="eyebrow">About {m0(monthly)} a month</div>
                {st.bills.map((b) => (
                  <div className="item" key={b.id} onClick={() => setEdit(b)}>
                    <div>
                      <div className="nm">{b.name || "Untitled"}</div>
                      <div className="mt">{(FREQ.find((f) => f[0] === b.freq) || [])[1]} · next {short(pd(b.firstDue))}{b.variable ? " · varies" : ""}</div>
                    </div>
                    <div className="vl num">{m0(num(b.amount))}</div>
                  </div>
                ))}
              </>
            )}
          </div>
          <button className="act" onClick={() => setEdit(blank())}>Add a bill</button>
        </>
      )}
    </>
  );
}

function BillForm({ b, onSave, onCancel, onDelete }) {
  const [f, setF] = useState(b);
  const set = (k, v) => setF({ ...f, [k]: v });
  return (
    <div className="card">
      <label className="f"><span>Name</span>
        <input value={f.name} placeholder="Rent, car insurance, Netflix" onChange={(e) => set("name", e.target.value)} /></label>
      <div className="row">
        <label className="f"><span>Amount</span>
          <input inputMode="decimal" placeholder="0.00" value={f.amount} onChange={(e) => set("amount", e.target.value)} /></label>
        <label className="f"><span>Next due date</span>
          <input type="date" value={f.firstDue} onChange={(e) => set("firstDue", e.target.value)} /></label>
      </div>
      <label className="f"><span>How often</span>
        <select value={f.freq} onChange={(e) => set("freq", e.target.value)}>
          {FREQ.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
        </select></label>
      <label className="f" style={{ display: "flex", alignItems: "center", gap: 9 }}>
        <input type="checkbox" checked={!!f.variable} style={{ width: 20, height: 20, flex: "none" }}
          onChange={(e) => set("variable", e.target.checked)} />
        <span style={{ margin: 0 }}>Amount changes month to month — budget a little high</span>
      </label>
      <button className="act" onClick={() => onSave(f)}>Save bill</button>
      <div style={{ height: 8 }} />
      <div className="row">
        <button className="act ghost" onClick={onCancel}>Cancel</button>
        <button className="act danger" onClick={onDelete}>Delete</button>
      </div>
    </div>
  );
}

/* --------------------------------- goals tab ------------------------------- */
function GoalsView({ st, up, m }) {
  const [edit, setEdit] = useState(null);
  const blank = (type) => ({ id: uid(), name: "", type, mode: "target", target: "", months: "12", monthly: "" });
  const save = (g) => {
    const has = st.goals.some((x) => x.id === g.id);
    up({ goals: has ? st.goals.map((x) => (x.id === g.id ? g : x)) : [...st.goals, g] });
    setEdit(null);
  };
  const rows = m.goalRows;
  const total = rows.reduce((a, g) => a + g.monthly, 0);

  if (edit) return <GoalForm g={edit} onSave={save} onCancel={() => setEdit(null)}
    onDelete={() => { up({ goals: st.goals.filter((x) => x.id !== edit.id) }); setEdit(null); }} />;

  return (
    <>
      <div className="card">
        {rows.length === 0 ? (
          <div className="empty"><b>No goals yet</b>Emergency fund, down payment, a card you want gone by spring.</div>
        ) : (
          <>
            <div className="eyebrow">{m0(total)} a month · {m0(total * 12 / 26)} a check</div>
            {rows.map((g) => (
              <div className="item" key={g.id} onClick={() => setEdit(st.goals.find((x) => x.id === g.id))}>
                <div>
                  <div className="nm">{g.name || "Untitled"}</div>
                  <div className="mt">{g.type === "debt" ? "Debt payoff" : "Savings"}
                    {g.mode === "target" ? ` · ${m0(num(g.target))} in ${num(g.months)} months` : " · steady amount"}</div>
                </div>
                <div className="vl num">{m0(g.monthly)}<span className="tiny">/mo</span></div>
              </div>
            ))}
          </>
        )}
      </div>
      <div className="row">
        <button className="act" onClick={() => setEdit(blank("savings"))}>Add savings</button>
        <button className="act" onClick={() => setEdit(blank("debt"))}>Add debt payoff</button>
      </div>
    </>
  );
}

function GoalForm({ g, onSave, onCancel, onDelete }) {
  const [f, setF] = useState(g);
  const set = (k, v) => setF({ ...f, [k]: v });
  const perMonth = f.mode === "fixed" ? num(f.monthly) : num(f.target) / Math.max(1, num(f.months));
  return (
    <div className="card">
      <label className="f"><span>Name</span>
        <input value={f.name} placeholder={f.type === "debt" ? "Visa payoff" : "Emergency fund"}
          onChange={(e) => set("name", e.target.value)} /></label>
      <label className="f"><span>How you want to set it</span>
        <select value={f.mode} onChange={(e) => set("mode", e.target.value)}>
          <option value="target">{f.type === "debt" ? "Pay off an amount by a deadline" : "Reach an amount by a deadline"}</option>
          <option value="fixed">Put away a set amount each month</option>
        </select></label>
      {f.mode === "target" ? (
        <div className="row">
          <label className="f"><span>{f.type === "debt" ? "Amount to pay off" : "Target amount"}</span>
            <input inputMode="decimal" placeholder="0.00" value={f.target} onChange={(e) => set("target", e.target.value)} /></label>
          <label className="f"><span>Within how many months</span>
            <input inputMode="numeric" value={f.months} onChange={(e) => set("months", e.target.value)} /></label>
        </div>
      ) : (
        <label className="f"><span>Amount each month</span>
          <input inputMode="decimal" placeholder="0.00" value={f.monthly} onChange={(e) => set("monthly", e.target.value)} /></label>
      )}
      <div className="note">That works out to {m2(perMonth)} a month, or {m2(perMonth * 12 / 26)} out of every check.</div>
      <button className="act" onClick={() => onSave(f)}>Save goal</button>
      <div style={{ height: 8 }} />
      <div className="row">
        <button className="act ghost" onClick={onCancel}>Cancel</button>
        <button className="act danger" onClick={onDelete}>Delete</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
